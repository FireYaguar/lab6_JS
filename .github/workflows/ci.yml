name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck # tsc під strict для всіх пакетів — типи стираються, тож перевірка тут, а не в рантаймі
      - run: npm run lint
      - run: npm test
      - run: npm run build
